# ============================================================================
# MongoDB Configuration
# ============================================================================
# SECURITY: MongoDB URI should be provided via environment variable!
#
# Set MONGODB_URI environment variable before starting the application:
#
# For local development:
#   export MONGODB_URI="mongodb://localhost:27017/product_catalog"
#
# For production (Atlas):
#   export MONGODB_URI="mongodb+srv://user:password@cluster.mongodb.net/?w=majority"
#
# For Spring profiles:
#   See application-dev.properties, application-prod.properties
# ============================================================================

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:product_catalog}


# Auto-create indexes declared with @Indexed in model classes.
# Required for the TTL index on InventoryReservation.expiresAt.
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=8080

# Application Name
spring.application.name=demo_pc_oms

# Logging (set to DEBUG to trace MongoDB queries during deep-dive sessions)
logging.level.org.springframework.data.mongodb=INFO

# Jackson JSON Configuration
# Exclude null fields from JSON responses for cleaner API output
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# Spring Boot Actuator Configuration (P1 FIX - Monitoring)
# ============================================================================
# Actuator provides health checks, metrics, and monitoring endpoints
# Access via: http://localhost:8080/actuator/health

# Expose health endpoint (safe for production)
management.endpoints.web.exposure.include=health,info

# Show detailed health information (only in dev/staging, not production!)
# Set to "when-authorized" in production
management.endpoint.health.show-details=always

# Health check components to include
management.health.mongo.enabled=true
management.health.diskspace.enabled=true

